<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Human Anatomy VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="anatomy-scene.js"></script>
    <script src="anatomy-data.js"></script>
    <script src="tts.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #menu {
        position: absolute; top: 20px; left: 20px;
        background: rgba(0,0,0,0.7); color: white;
        padding: 10px; border-radius: 8px;
        z-index: 1000;
      }
      button, select { 
        margin: 5px; padding: 8px 12px; border: none; border-radius: 5px; 
        cursor: pointer; background: #4CAF50; color: white;
        transition: background 0.3s;
      }
      button:hover, select:hover { background: #45a049; }
      h3 { margin-top: 0; color: #4CAF50; }
      label { color: #4CAF50; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="menu">
      <h3>🦴 Select Body System</h3>
      <button onclick="loadSystem('skeletal')">🦴 Skeletal</button>
      <button onclick="loadSystem('circulatory')">❤️ Circulatory</button>
      <button onclick="loadSystem('respiratory')">🫁 Respiratory</button>
      <button onclick="loadSystem('digestive')">🍽️ Digestive</button>
      <button onclick="loadSystem('nervous')">🧠 Nervous</button>
      <button onclick="loadSystem('muscular')">💪 Muscular</button>
      <button onclick="loadSystem('reproductive')">👶 Reproductive</button>
      <br>
      <label for="lang">🌐 Language:</label>
      <select id="lang" onchange="setLanguage(this.value)">
        <option value="en">🇺🇸 English</option>
        <option value="hi">🇮🇳 हिंदी (Hindi)</option>
        <option value="kn">🇮🇳 ಕನ್ನಡ (Kannada)</option>
        <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
        <option value="te">🇮🇳 తెలుగు (Telugu)</option>
        <option value="mr">🇮🇳 मराठी (Marathi)</option>
        <option value="bn">🇮🇳 বাংলা (Bengali)</option>
      </select>
    </div>

    <a-scene background="color: #000011">
      <!-- Dummy Models for Testing -->
      
      <!-- Skeletal System: White cylinder + box combo -->
      <a-entity id="skeletal" visible="false">
        <a-box color="white" depth="0.5" height="2" width="0.5" position="0 0.5 -4"></a-box>
        <a-cylinder color="white" height="1.5" radius="0.3" position="0 2 -4"></a-cylinder>
        <a-text value="SKELETAL SYSTEM" position="0 3 -4" align="center" color="white" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Circulatory System: Red sphere (heart) -->
      <a-entity id="circulatory" visible="false">
        <a-sphere color="red" radius="0.5" position="0 1.5 -3"></a-sphere>
        <a-text value="CIRCULATORY SYSTEM" position="0 2.5 -3" align="center" color="red" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Respiratory System: 2 pink spheres (lungs) -->
      <a-entity id="respiratory" visible="false">
        <a-sphere color="pink" radius="0.4" position="-0.5 1.5 -3"></a-sphere>
        <a-sphere color="pink" radius="0.4" position="0.5 1.5 -3"></a-sphere>
        <a-text value="RESPIRATORY SYSTEM" position="0 2.5 -3" align="center" color="pink" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Digestive System: Orange tube -->
      <a-entity id="digestive" visible="false">
        <a-cylinder color="orange" height="2" radius="0.3" position="0 1 -3"></a-cylinder>
        <a-text value="DIGESTIVE SYSTEM" position="0 2.5 -3" align="center" color="orange" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Nervous System: Yellow brain shape -->
      <a-entity id="nervous" visible="false">
        <a-sphere color="yellow" radius="0.6" position="0 1.5 -3"></a-sphere>
        <a-text value="NERVOUS SYSTEM" position="0 2.5 -3" align="center" color="yellow" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Muscular System: Red muscle shapes -->
      <a-entity id="muscular" visible="false">
        <a-box color="darkred" depth="0.3" height="1.5" width="0.8" position="-0.3 1 -3"></a-box>
        <a-box color="darkred" depth="0.3" height="1.5" width="0.8" position="0.3 1 -3"></a-box>
        <a-text value="MUSCULAR SYSTEM" position="0 2.5 -3" align="center" color="darkred" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Reproductive System: Purple shapes -->
      <a-entity id="reproductive" visible="false">
        <a-sphere color="purple" radius="0.3" position="-0.3 1 -3"></a-sphere>
        <a-sphere color="purple" radius="0.3" position="0.3 1 -3"></a-sphere>
        <a-text value="REPRODUCTIVE SYSTEM" position="0 2.5 -3" align="center" color="purple" scale="0.5 0.5 0.5"></a-text>
      </a-entity>

      <!-- Camera Rig -->
      <a-entity id="cameraRig" position="0 1.6 3">
        <a-camera look-controls wasd-controls></a-camera>
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" color="#404040"></a-light>
      <a-light type="directional" position="2 4 2" color="#ffffff" intensity="0.8"></a-light>
    </a-scene>
  </body>
</html>
