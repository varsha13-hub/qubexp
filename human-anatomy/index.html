<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Human Anatomy VR</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="anatomy-scene.js"></script>
    <script src="anatomy-data.js"></script>
    <script src="tts.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #menu {
        position: absolute; top: 20px; left: 20px;
        background: rgba(0,0,0,0.7); color: white;
        padding: 10px; border-radius: 8px;
        z-index: 1000;
      }
      button, select { 
        margin: 5px; padding: 8px 12px; border: none; border-radius: 5px; 
        cursor: pointer; background: #4CAF50; color: white;
        transition: background 0.3s;
      }
      button:hover, select:hover { background: #45a049; }
      h3 { margin-top: 0; color: #4CAF50; }
      label { color: #4CAF50; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="menu">
      <h3>🦴 Human Anatomy VR</h3>
      <div id="systemButtons">
        <button onclick="loadSystem('skeletal')">🦴 Skeletal</button>
        <button onclick="loadSystem('circulatory')">❤️ Circulatory</button>
        <button onclick="loadSystem('respiratory')">🫁 Respiratory</button>
        <button onclick="loadSystem('digestive')">🍽️ Digestive</button>
        <button onclick="loadSystem('nervous')">🧠 Nervous</button>
        <button onclick="loadSystem('muscular')">💪 Muscular</button>
        <button onclick="loadSystem('reproductive')">👶 Reproductive</button>
      </div>
      <div id="controlButtons" style="display: none;">
        <button onclick="returnToAllSystems()" style="background: #FF6B6B;">⬅️ Back to All Systems</button>
      </div>
      <br>
      <label for="lang">🌐 Language:</label>
      <select id="lang" onchange="setLanguage(this.value)">
        <option value="en">🇺🇸 English</option>
        <option value="hi">🇮🇳 हिंदी (Hindi)</option>
        <option value="kn">🇮🇳 ಕನ್ನಡ (Kannada)</option>
        <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
        <option value="te">🇮🇳 తెలుగు (Telugu)</option>
        <option value="mr">🇮🇳 मराठी (Marathi)</option>
        <option value="bn">🇮🇳 বাংলা (Bengali)</option>
      </select>
    </div>

    <a-scene background="color: #000011" vr-mode-ui="enabled: true">
      <!-- Full Human Body Model (Initial State) -->
      <a-entity id="fullBody" class="human-body">
        <!-- Head -->
        <a-sphere color="#FFDBAC" radius="0.4" position="0 2.2 0" class="body-part" data-system="nervous"></a-sphere>
        
        <!-- Torso -->
        <a-box color="#FFDBAC" depth="0.8" height="1.2" width="0.6" position="0 1.2 0" class="body-part" data-system="circulatory"></a-box>
        
        <!-- Arms -->
        <a-cylinder color="#FFDBAC" height="1.2" radius="0.15" position="-0.8 1.2 0" rotation="0 0 20" class="body-part" data-system="muscular"></a-cylinder>
        <a-cylinder color="#FFDBAC" height="1.2" radius="0.15" position="0.8 1.2 0" rotation="0 0 -20" class="body-part" data-system="muscular"></a-cylinder>
        
        <!-- Legs -->
        <a-cylinder color="#FFDBAC" height="1.4" radius="0.2" position="-0.3 -0.8 0" class="body-part" data-system="skeletal"></a-cylinder>
        <a-cylinder color="#FFDBAC" height="1.4" radius="0.2" position="0.3 -0.8 0" class="body-part" data-system="skeletal"></a-cylinder>
        
        <!-- Simple clothing -->
        <a-box color="#4A90E2" depth="0.85" height="0.8" width="0.65" position="0 1.4 0"></a-box>
        <a-box color="#2E7D32" depth="0.25" height="0.6" width="0.25" position="-0.3 -0.2 0"></a-box>
        <a-box color="#2E7D32" depth="0.25" height="0.6" width="0.25" position="0.3 -0.2 0"></a-box>
      </a-entity>

      <!-- Separated Body Systems (Hidden Initially) -->
      <a-entity id="bodySystems" visible="false">
        <!-- Skeletal System -->
        <a-entity id="skeletal" class="body-system" position="0 0 -2">
          <a-box color="white" depth="0.5" height="2" width="0.5" position="0 0.5 0"></a-box>
          <a-cylinder color="white" height="1.5" radius="0.3" position="0 2 0"></a-cylinder>
          <a-cylinder color="white" height="1.2" radius="0.15" position="-0.8 1.2 0" rotation="0 0 20"></a-cylinder>
          <a-cylinder color="white" height="1.2" radius="0.15" position="0.8 1.2 0" rotation="0 0 -20"></a-cylinder>
          <a-cylinder color="white" height="1.4" radius="0.2" position="-0.3 -0.8 0"></a-cylinder>
          <a-cylinder color="white" height="1.4" radius="0.2" position="0.3 -0.8 0"></a-cylinder>
          <a-text value="🦴 SKELETAL SYSTEM" position="0 3 0" align="center" color="white" scale="0.8 0.8 0.8"></a-text>
        </a-entity>

        <!-- Circulatory System -->
        <a-entity id="circulatory" class="body-system" position="2 0 -2">
          <a-sphere color="red" radius="0.5" position="0 1.5 0"></a-sphere>
          <a-cylinder color="red" height="0.1" radius="0.05" position="-0.5 1.5 0"></a-cylinder>
          <a-cylinder color="red" height="0.1" radius="0.05" position="0.5 1.5 0"></a-cylinder>
          <a-cylinder color="red" height="0.1" radius="0.05" position="0 1.5 -0.5"></a-cylinder>
          <a-cylinder color="red" height="0.1" radius="0.05" position="0 1.5 0.5"></a-cylinder>
          <a-text value="❤️ CIRCULATORY SYSTEM" position="0 2.5 0" align="center" color="red" scale="0.8 0.8 0.8"></a-text>
        </a-entity>

        <!-- Respiratory System -->
        <a-entity id="respiratory" class="body-system" position="-2 0 -2">
          <a-sphere color="pink" radius="0.4" position="-0.5 1.5 0"></a-sphere>
          <a-sphere color="pink" radius="0.4" position="0.5 1.5 0"></a-sphere>
          <a-cylinder color="pink" height="0.8" radius="0.1" position="0 2.2 0"></a-cylinder>
          <a-text value="🫁 RESPIRATORY SYSTEM" position="0 2.5 0" align="center" color="pink" scale="0.8 0.8 0.8"></a-text>
        </a-entity>

        <!-- Digestive System -->
        <a-entity id="digestive" class="body-system" position="0 2 -2">
          <a-cylinder color="orange" height="2" radius="0.3" position="0 1 0"></a-cylinder>
          <a-sphere color="orange" radius="0.2" position="0 0.2 0"></a-sphere>
          <a-cylinder color="orange" height="0.5" radius="0.15" position="0 -0.5 0"></a-cylinder>
          <a-text value="🍽️ DIGESTIVE SYSTEM" position="0 2.5 0" align="center" color="orange" scale="0.8 0.8 0.8"></a-text>
        </a-entity>

        <!-- Nervous System -->
        <a-entity id="nervous" class="body-system" position="0 -2 -2">
          <a-sphere color="yellow" radius="0.6" position="0 1.5 0"></a-sphere>
          <a-cylinder color="yellow" height="1.5" radius="0.1" position="0 0.5 0"></a-cylinder>
          <a-cylinder color="yellow" height="0.1" radius="0.05" position="-0.3 0.5 0"></a-cylinder>
          <a-cylinder color="yellow" height="0.1" radius="0.05" position="0.3 0.5 0"></a-cylinder>
          <a-text value="🧠 NERVOUS SYSTEM" position="0 2.5 0" align="center" color="yellow" scale="0.8 0.8 0.8"></a-text>
        </a-entity>

        <!-- Muscular System -->
        <a-entity id="muscular" class="body-system" position="2 2 -2">
          <a-box color="darkred" depth="0.3" height="1.5" width="0.8" position="-0.3 1 0"></a-box>
          <a-box color="darkred" depth="0.3" height="1.5" width="0.8" position="0.3 1 0"></a-box>
          <a-cylinder color="darkred" height="1.2" radius="0.2" position="-0.8 1.2 0" rotation="0 0 20"></a-cylinder>
          <a-cylinder color="darkred" height="1.2" radius="0.2" position="0.8 1.2 0" rotation="0 0 -20"></a-cylinder>
          <a-text value="💪 MUSCULAR SYSTEM" position="0 2.5 0" align="center" color="darkred" scale="0.8 0.8 0.8"></a-text>
        </a-entity>

        <!-- Reproductive System -->
        <a-entity id="reproductive" class="body-system" position="-2 2 -2">
          <a-sphere color="purple" radius="0.3" position="-0.3 1 0"></a-sphere>
          <a-sphere color="purple" radius="0.3" position="0.3 1 0"></a-sphere>
          <a-cylinder color="purple" height="0.5" radius="0.1" position="0 0.5 0"></a-cylinder>
          <a-text value="👶 REPRODUCTIVE SYSTEM" position="0 2.5 0" align="center" color="purple" scale="0.8 0.8 0.8"></a-text>
        </a-entity>
      </a-entity>

      <!-- Camera Rig -->
      <a-entity id="cameraRig" position="0 1.6 4">
        <a-camera look-controls wasd-controls></a-camera>
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" color="#404040"></a-light>
      <a-light type="directional" position="2 4 2" color="#ffffff" intensity="0.8"></a-light>
      
      <!-- VR Controls -->
      <a-entity id="leftHand" hand-controls="hand: left"></a-entity>
      <a-entity id="rightHand" hand-controls="hand: right"></a-entity>
    </a-scene>
  </body>
</html>
