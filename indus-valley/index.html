<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indus Valley VR - Advanced Multi-Zone</title>
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <!-- Custom Navigation Controls Component -->
    <script>
        AFRAME.registerComponent('custom-controls', {
            schema: {
                speed: { type: 'number', default: 0.3 },
                fly: { type: 'boolean', default: false }
            },
            init: function () {
                this.keys = {
                    KeyW: false, ArrowUp: false,
                    KeyS: false, ArrowDown: false,
                    KeyA: false,
                    KeyD: false,
                    ArrowLeft: false,
                    ArrowRight: false,
                    KeyE: false, Space: false,
                    KeyQ: false, ShiftLeft: false
                };
                
                this.onKeyDown = this.onKeyDown.bind(this);
                this.onKeyUp = this.onKeyUp.bind(this);
                window.addEventListener('keydown', this.onKeyDown);
                window.addEventListener('keyup', this.onKeyUp);
                
                this.el.sceneEl.addEventListener('click', () => {
                    window.focus();
                });
                
                this.cameraEl = this.el.querySelector('[camera]') || this.el.querySelector('a-camera');
            },
            remove: function () {
                window.removeEventListener('keydown', this.onKeyDown);
                window.removeEventListener('keyup', this.onKeyUp);
            },
            onKeyDown: function (e) {
                let code = e.code;
                if (e.key === 'e' || e.key === 'E') code = 'KeyE';
                if (e.key === 'q' || e.key === 'Q') code = 'KeyQ';
                if (e.key === 'w' || e.key === 'W') code = 'KeyW';
                if (e.key === 's' || e.key === 'S') code = 'KeyS';
                if (e.key === 'a' || e.key === 'A') code = 'KeyA';
                if (e.key === 'd' || e.key === 'D') code = 'KeyD';
                if (e.key === ' ') code = 'Space';
                
                if (code in this.keys) {
                    this.keys[code] = true;
                }
            },
            onKeyUp: function (e) {
                let code = e.code;
                if (e.key === 'e' || e.key === 'E') code = 'KeyE';
                if (e.key === 'q' || e.key === 'Q') code = 'KeyQ';
                if (e.key === 'w' || e.key === 'W') code = 'KeyW';
                if (e.key === 's' || e.key === 'S') code = 'KeyS';
                if (e.key === 'a' || e.key === 'A') code = 'KeyA';
                if (e.key === 'd' || e.key === 'D') code = 'KeyD';
                if (e.key === ' ') code = 'Space';
                
                if (code in this.keys) {
                    this.keys[code] = false;
                }
            },
            tick: function (time, timeDelta) {
                const speed = this.data.speed * (timeDelta / 1000) * 60; 
                const rotSpeed = 2.0 * (timeDelta / 1000) * 60; // rotation speed (degrees per frame)
                
                const pos = this.el.getAttribute('position');
                const rot = this.el.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
                if (!pos) return;
                
                // Keyboard camera turning (Y-axis rotation)
                if (this.keys.ArrowLeft) {
                    rot.y += rotSpeed;
                }
                if (this.keys.ArrowRight) {
                    rot.y -= rotSpeed;
                }
                this.el.setAttribute('rotation', rot);
                
                if (!this.cameraEl) return;
                
                // Calculate directional vectors from camera
                let forward = new THREE.Vector3();
                this.cameraEl.object3D.getWorldDirection(forward);
                forward.negate(); // Vector points towards camera facing direction
                
                if (!this.data.fly) {
                    forward.y = 0; // lock movement to horizontal plane
                }
                forward.normalize();
                
                let right = new THREE.Vector3();
                right.crossVectors(forward, new THREE.Vector3(0, 1, 0));
                right.normalize();
                
                let moveVector = new THREE.Vector3();
                if (this.keys.KeyW || this.keys.ArrowUp) {
                    moveVector.add(forward);
                }
                if (this.keys.KeyS || this.keys.ArrowDown) {
                    moveVector.sub(forward);
                }
                if (this.keys.KeyA) {
                    moveVector.sub(right); // strafe left
                }
                if (this.keys.KeyD) {
                    moveVector.add(right); // strafe right
                }
                
                moveVector.normalize();
                moveVector.multiplyScalar(speed);
                
                pos.x += moveVector.x;
                pos.z += moveVector.z;
                
                if (this.data.fly) {
                    pos.y += moveVector.y;
                }
                
                // Explicit elevation controls
                if (this.keys.KeyE || this.keys.Space) pos.y += speed * 0.7;
                if (this.keys.KeyQ || this.keys.ShiftLeft) pos.y = Math.max(0.2, pos.y - speed * 0.7);
                
                this.el.setAttribute('position', pos);
            }
        });

        // =============================================
        // Flowing Water Component for the Great Bath
        // =============================================
        AFRAME.registerComponent('flowing-water', {
            schema: {
                speed:     { type: 'number', default: 0.4 },
                waveAmp:   { type: 'number', default: 0.04 },
                waveFreq:  { type: 'number', default: 1.8 },
                color1:    { type: 'color',  default: '#1a6e8a' },
                color2:    { type: 'color',  default: '#0d4f6e' }
            },
            init: function () {
                this.t = 0;
                this.baseY = this.el.object3D.position.y;
                // UV offset object for scrolling
                this.uvOffset = new THREE.Vector2(0, 0);
                this.color1 = new THREE.Color(this.data.color1);
                this.color2 = new THREE.Color(this.data.color2);
                this.lerpColor = new THREE.Color();
            },
            tick: function (time, delta) {
                this.t += delta * 0.001;
                const t = this.t;

                // 1. Sine-wave height bob
                const waveY = this.baseY + Math.sin(t * this.data.waveFreq) * this.data.waveAmp;
                this.el.object3D.position.y = waveY;

                // 2. UV scroll (flowing effect)
                const mesh = this.el.getObject3D('mesh');
                if (mesh) {
                    mesh.traverse(child => {
                        if (child.isMesh && child.material && child.material.map) {
                            child.material.map.offset.x = (t * this.data.speed * 0.1) % 1;
                            child.material.map.offset.y = (t * this.data.speed * 0.06) % 1;
                            child.material.map.needsUpdate = true;
                        }
                    });
                }

                // 3. Colour pulse between deep teal and dark blue
                const lerpT = (Math.sin(t * 0.8) + 1) / 2;
                this.lerpColor.lerpColors(this.color1, this.color2, lerpT);
                const mat = this.el.getObject3D('mesh');
                if (mat) {
                    mat.traverse(child => {
                        if (child.isMesh && child.material) {
                            child.material.color.copy(this.lerpColor);
                        }
                    });
                }
            }
        });

        // =============================================
        // Brick Material Override for Great Bath GLTF
        // =============================================
        AFRAME.registerComponent('brick-material-override', {
            schema: {
                color:      { type: 'color',  default: '#9e6244' },
                roughness:  { type: 'number', default: 0.95 },
                metalness:  { type: 'number', default: 0.0 },
                repeatX:    { type: 'number', default: 6 },
                repeatY:    { type: 'number', default: 6 }
            },
            init: function () {
                this.el.addEventListener('model-loaded', () => {
                    const textureEl = document.querySelector('#brick-texture');
                    if (!textureEl) return;

                    // Get the THREE texture from the A-Frame image asset
                    const loader = new THREE.TextureLoader();
                    loader.load(textureEl.src, (tex) => {
                        tex.wrapS = THREE.RepeatWrapping;
                        tex.wrapT = THREE.RepeatWrapping;
                        tex.repeat.set(this.data.repeatX, this.data.repeatY);

                        const brickColor = new THREE.Color(this.data.color);

                        this.el.object3D.traverse(child => {
                            if (!child.isMesh) return;
                            // Preserve transparency on parts that should stay open (pool water gap)
                            const newMat = new THREE.MeshStandardMaterial({
                                map: tex,
                                color: brickColor,
                                roughness: this.data.roughness,
                                metalness: this.data.metalness,
                                side: THREE.DoubleSide
                            });
                            child.material = newMat;
                            child.material.needsUpdate = true;
                        });
                    });
                });
            }
        });
    </script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2>Loading Historical Data & Environments...</h2>
    </div>

    <!-- Notifications -->
    <div id="notification-container"></div>

    <!-- 2D Glassmorphic UI Overlay -->
    <div id="ui-layer">
        
        <!-- Header & HUD -->
        <div class="hud-header">
            <div class="glass-panel title-card">
                <h1>Indus Valley</h1>
                <p id="current-zone-title">Exploring the City...</p>
            </div>
            
            <div class="glass-panel gamification-hud">
                <h3>Zone Quests</h3>
                <p style="color: #ccc; margin-bottom: 10px;">Found: <span id="quest-progress">0/0</span></p>
                <div class="artifact-slots" id="quest-slots">
                    <!-- dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Info Panel (Hidden by default) -->
        <div class="info-panel-container">
            <div class="glass-panel info-panel" id="info-panel">
                <h2 id="info-title">Title</h2>
                <p id="info-desc">Description text goes here.</p>
                <div class="tts-controls">
                    <button class="btn" id="btn-toggle-tts">🔊 Audio On</button>
                    <select class="glass-select" id="lang-select">
                        <option value="en" selected>English</option>
                        <option value="hi">हिंदी (Hindi)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                    </select>
                    <button class="btn" id="btn-close-info">✖ Close</button>
                </div>
            </div>
        </div>

        <!-- Controls Legend Panel -->
        <div class="glass-panel" style="pointer-events: auto; padding: 15px 20px; position: absolute; bottom: 20px; left: 20px; width: 230px; border: 1px solid rgba(244, 164, 96, 0.3); text-align: left; z-index: 150;">
            <h4 style="font-family: 'Outfit', sans-serif; color: #f4a460; margin-bottom: 8px; font-weight: 600; font-size: 1rem; text-shadow: 0 1px 5px rgba(244, 164, 96, 0.2);">Controls</h4>
            <div style="font-size: 0.82rem; color: #eee; line-height: 1.6;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>Move Forward/Back:</span><span style="color: #f4a460; font-weight: bold;">W / S</span></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>Strafe Left/Right:</span><span style="color: #f4a460; font-weight: bold;">A / D</span></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>Turn Left/Right:</span><span style="color: #3498db; font-weight: bold;">◀ ▶ Arrows</span></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>Look:</span><span style="color: #f4a460; font-weight: bold;">Mouse Drag</span></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>Fly Up:</span><span style="color: #2ecc71; font-weight: bold;">E Key ⬆</span></div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><span>Fly Down:</span><span style="color: #e74c3c; font-weight: bold;">Q Key ⬇</span></div>
            </div>
        </div>

        <div style="pointer-events: auto; text-align: center; margin-bottom: 20px;">
            <a href="../index.html" class="btn" style="display: inline-block;">🏠 Back to Hub</a>
        </div>
    </div>

    <!-- UI Layer Ends -->

    <!-- 3D Scene -->
    <a-scene 
        loading-screen="enabled: false;"
        renderer="colorManagement: true; physicallyCorrectLights: true;">
        
        <!-- Assets -->
        <a-assets timeout="30000">
            <a-asset-item id="entrance" src="assets/models/entrance_-_the_city_of_mohenjo_daro.glb"></a-asset-item>
            <a-asset-item id="greatbath" src="assets/models/the_great_bath.glb"></a-asset-item>
            <!-- Custom textures for Residential Quarter -->
            <img id="brick-texture" src="assets/textures/baked_brick.jpg">
            <img id="earth-texture" src="assets/textures/courtyard_earth.jpg">
            <img id="wood-texture" src="assets/textures/ancient_wood.jpg">
        </a-assets>

        <!-- Lighting -->
        <a-light type="ambient" color="#FFF" intensity="0.6"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.8" position="-1 1 0" castShadow="true"></a-light>

        <!-- Global City Ground -->
        <a-plane position="0 -0.1 0" rotation="-90 0 0" width="200" height="200" material="src: #earth-texture; repeat: 100 100; roughness: 0.9"></a-plane>

        <!-- Procedural City Container -->
        <a-entity id="procedural-city-container"></a-entity>

        <!-- The Open World Map Layout -->
        
        <!-- City Entrance (Start Point: Z = 30) -->
        <a-entity id="entrance-model" gltf-model="#entrance" position="0 0 30" scale="1.5 1.5 1.5"></a-entity>
        
        <!-- The Citadel (North: X = 0, Z = -55) — RESTORED CLEAN PLATFORM -->
        <a-entity id="citadel" position="0 0 -55">
            <!-- Citadel West Platform (Granary area: X = -20) -->
            <a-box position="-20 2 0" width="30" height="4" depth="40" material="src: #brick-texture; repeat: 30 10; roughness: 1.0"></a-box>
            
            <!-- Citadel East Platform (Assembly Hall area: X = 22) -->
            <a-box position="22 2 0" width="30" height="4" depth="40" material="src: #brick-texture; repeat: 30 10; roughness: 1.0"></a-box>

            <!-- Raised Mound for the Great Granary (X = -20) -->
            <a-box position="-20 5.5 0" width="22" height="3" depth="22" material="src: #brick-texture; repeat: 10 3; roughness: 1.0"></a-box>

            <!-- Brick Stairs leading up to the Granary Mound -->
            <a-box position="-20 4.15 15" width="6" height="0.3" depth="1" material="src: #brick-texture; repeat: 6 1; roughness: 1.0"></a-box>
            <a-box position="-20 4.75 14" width="6" height="0.3" depth="1" material="src: #brick-texture; repeat: 6 1; roughness: 1.0"></a-box>
            <a-box position="-20 5.35 13" width="6" height="0.3" depth="1" material="src: #brick-texture; repeat: 6 1; roughness: 1.0"></a-box>
            <a-box position="-20 5.95 12" width="6" height="0.3" depth="1" material="src: #brick-texture; repeat: 6 1; roughness: 1.0"></a-box>
            <a-box position="-20 6.55 11" width="6" height="0.3" depth="1" material="src: #brick-texture; repeat: 6 1; roughness: 1.0"></a-box>

            <a-box position="0 2 25" rotation="15 0 0" width="10" height="2" depth="15" material="src: #brick-texture; repeat: 10 3"></a-box>
        </a-entity>

        <!-- The Great Bath (pool model only, no base/rooms/gate) -->
        <a-entity id="great-bath-complex" position="60 0 -29">
            <!-- GLTF model lowered by 1.5m so its deck is flush with the ground and the base is buried -->
            <a-entity id="greatbath-model"
                gltf-model="#greatbath"
                position="0 -1.5 0"
                scale="1.4 1.4 1.4"
                rotation="0 90 0"
                brick-material-override="color: #8c5a3a; roughness: 0.96; metalness: 0.0; repeatX: 8; repeatY: 8">
            </a-entity>

            <!--
                WATER — Three stacked a-box volumes.
                The GLTF deck sits at Y≈0 (local). The pool opening is at Y≈0.
                Raise water top to Y=0.35 so it sits visibly inside the pool,
                fully covers the cavity, and is never occluded by the ground plane.
            -->

            <!-- DEEP water body — completely fills the pool from floor to surface -->
            <a-box
                id="bath-water-volume"
                position="0 -0.45 0"
                width="11.5"
                height="1.5"
                depth="19.5"
                material="color: #0b4a60; opacity: 1.0; roughness: 0.0; metalness: 0.1">
                <a-animation attribute="material.color"
                    from="#0b4a60" to="#0d5f7a"
                    dur="3000" repeat="indefinite" direction="alternate" easing="linear">
                </a-animation>
            </a-box>

            <!-- SURFACE teal layer — sits ON TOP of the deep volume, animated colour -->
            <a-box
                id="bath-water-surface"
                position="0 0.3 0"
                width="11.5"
                height="0.08"
                depth="19.5"
                material="color: #1a8faa; opacity: 0.88; transparent: true; roughness: 0.0; metalness: 0.4; side: double">
                <a-animation attribute="material.color"
                    from="#1a8faa" to="#2ab8d4"
                    dur="2500" repeat="indefinite" direction="alternate" easing="linear">
                </a-animation>
                <a-animation attribute="position"
                    from="0 0.30 0" to="0 0.33 0"
                    dur="1800" repeat="indefinite" direction="alternate" easing="easeInOutSine">
                </a-animation>
            </a-box>

            <!-- SHIMMER highlight — thin specular flash on the very top -->
            <a-box
                id="bath-water-shimmer"
                position="0 0.35 0"
                width="11.5"
                height="0.025"
                depth="19.5"
                material="color: #7ef0ff; opacity: 0.18; transparent: true; roughness: 0.0; metalness: 0.9; side: double">
                <a-animation attribute="material.opacity"
                    from="0.10" to="0.28"
                    dur="1500" repeat="indefinite" direction="alternate" easing="easeInOutSine">
                </a-animation>
            </a-box>



            <!-- =============================================
                 GREAT BATH CORBELLED DRAINAGE CHANNEL
                 Historically: a corbelled brick drain ran Westward from
                 the pool outlet, passing under the deck and exiting
                 through the citadel wall to the main street sewer.
                 Local coords: pool edge ~X=-5, runs to X=-16.5 along Z=6.
                 ============================================= -->
            <a-entity id="great-bath-drain">
                <!-- Muddy waste water flowing inside the channel trench -->
                <a-plane position="-11 -0.68 6" rotation="-90 0 0" width="11" height="0.65"
                         material="color: #2e2018; roughness: 0.1; metalness: 0.2; transparent: true; opacity: 0.88"
                         flowing-water="speed: 0.9; waveAmp: 0.015; waveFreq: 5; color1: #2e2018; color2: #1a1208">
                </a-plane>
                <!-- Channel Side Walls -->
                <a-box position="-11 -0.2 5.55" width="11" height="1.0" depth="0.15" material="src: #brick-texture; color: #8c5a3a; repeat: 8 1; roughness: 1.0"></a-box>
                <a-box position="-11 -0.2 6.45" width="11" height="1.0" depth="0.15" material="src: #brick-texture; color: #8c5a3a; repeat: 8 1; roughness: 1.0"></a-box>
                <!-- Corbelled Roof — step-in bricks forming the cover -->
                <a-box position="-11 0.38 5.7"  width="11" height="0.14" depth="0.28" material="src: #brick-texture; color: #7a4d33; repeat: 8 1; roughness: 1.0"></a-box>
                <a-box position="-11 0.38 6.3"  width="11" height="0.14" depth="0.28" material="src: #brick-texture; color: #7a4d33; repeat: 8 1; roughness: 1.0"></a-box>
                <a-box position="-11 0.48 6.0"  width="11" height="0.14" depth="0.52" material="src: #brick-texture; color: #6b4430; repeat: 8 1; roughness: 1.0"></a-box>
                <!-- Open Inspection Shaft near the pool edge (X=-6.5) with interactive grating -->
                <a-box position="-6.5 0.56 6" width="1.1" height="0.08" depth="1.1"
                       material="color: #2b1e14; roughness: 1.0"
                       class="clickable"
                       data-info="Great Bath Corbelled Drain: This brick-lined channel discharged waste water from the pool into the main street sewer. An open inspection shaft allowed workers to clear silt blockages. One of the world's earliest planned sewage outlets.">
                </a-box>
            </a-entity>

            <!-- =============================================
                 CIRCULAR PILLARS ENCLOSING THE GREAT BATH (OUTWARD)
                 ============================================= -->
            <!-- Corners -->
            <a-cylinder position="-13 2.75 -18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="13 2.75 -18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="-13 2.75 18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="13 2.75 18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>

            <!-- West Side -->
            <a-cylinder position="-13 2.75 -12.33" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="-13 2.75 -6.17" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="-13 2.75 0" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="-13 2.75 6.17" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="-13 2.75 12.33" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>

            <!-- East Side -->
            <a-cylinder position="13 2.75 -12.33" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="13 2.75 -6.17" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="13 2.75 0" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="13 2.75 6.17" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="13 2.75 12.33" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>

            <!-- North Side -->
            <a-cylinder position="-6.5 2.75 -18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="0 2.75 -18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
            <a-cylinder position="6.5 2.75 -18.5" radius="0.4" height="5.5" material="src: #brick-texture; color: #8c5a3a; repeat: 2 8; roughness: 1.0"></a-cylinder>
