<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working SolarLearn VR - India</title>
    <!-- Cache bust: 2024-12-19-SARVAM-ONLY-TTS -->
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#001133">
    
    <!-- A-Frame for VR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    
        <!-- THREE.js compatibility shim for aframe-extras -->
        <script>
            // Fix THREE.Math.degToRad compatibility issue
            if (typeof THREE !== 'undefined') {
                if (!THREE.Math && THREE.MathUtils) {
                    THREE.Math = THREE.Math || {}
                    
                    THREE.Math.degToRad = THREE.MathUtils.degToRad;
                    THREE.Math.radToDeg = THREE.MathUtils.radToDeg;
                }
            }
        </script>
        
        <!-- A-Frame Extras for GLTF loader -->
        <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
        
        <!-- Service Worker Registration -->
        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("./sw.js")
                        .then(reg => console.log("✅ Service Worker registered:", reg))
                        .catch(err => console.log("❌ Service Worker failed:", err));
                });
            }
        </script>
    <style>
        body { margin: 0; padding: 0; }
        a-scene { width: 100%; height: 100vh; }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .control-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            border-radius: 10px;
            min-width: 250px;
        }
        .control-panel h4 {
            margin: 0 0 10px 0;
            color: #00ff88;
        }
        .control-panel button {
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .control-panel button:hover {
            background: #00cc6a;
        }
        .control-panel select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            margin: 5px;
            border-radius: 3px;
        }
        
        /* Voice command styles */
        .voice-controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            border-radius: 10px;
            min-width: 200px;
        }
        .voice-controls h4 {
            margin: 0 0 10px 0;
            color: #ff6b6b;
        }
        .voice-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .voice-btn:hover {
            background: #ff5252;
        }
        .voice-btn.listening {
            background: #ff0000;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .voice-status {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
        }
        .info-panel {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 15px;
            z-index: 1000;
            font-family: Arial, sans-serif;
            border-radius: 10px;
            max-width: 300px;
        }
        .status {
            color: #00ff88;
            font-weight: bold;
        }
        
        /* Ensure panels are visible in VR mode */
        .control-panel, .info-panel {
            z-index: 9999 !important;
        }
        
        /* VR-specific styles */
        .vr-controls {
            display: none; /* Hidden by default, shown in VR */
        }
        
        /* Show VR controls when in VR mode */
        .a-enter-vr .vr-controls {
            display: block;
        }
        
        /* 3D Button styles for VR */
        .vr-button {
            background: #00ff88;
            color: #1a1a2e;
            border: 2px solid #00cc6a;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .vr-button:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }
        
        /* Language Menu Styles */
        .language-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e, #16213e);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            font-family: 'Arial', sans-serif;
        }

        .menu-content {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .menu-content h2 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .menu-content p {
            color: #ccc;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .language-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .lang-option {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .lang-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .lang-option.active {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .enter-vr-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 1.2rem 2.5rem;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .enter-vr-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        
        .tour-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin: 10px 0;
        }
        
        .tour-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
        
        .tour-btn:active {
            transform: translateY(0);
        }
        
        .test-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            margin: 5px 0;
        }
        
        .test-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- Pre-VR Language Selection Screen -->
    <div id="languageMenu" class="language-menu">
        <div class="menu-content">
            <h2>🌍 Choose Your Language</h2>
            <p>Select your preferred language before entering VR</p>
            <div class="language-options">
                <button class="lang-option active" data-lang="en">
                    🇺🇸 English
                </button>
                <button class="lang-option" data-lang="hi">
                    🇮🇳 हिंदी (Hindi)
                </button>
                <button class="lang-option" data-lang="kn">
                    🇮🇳 ಕನ್ನಡ (Kannada)
                </button>
                <button class="lang-option" data-lang="ta">
                    🇮🇳 தமிழ் (Tamil)
                </button>
                <button class="lang-option" data-lang="te">
                    🇮🇳 తెలుగు (Telugu)
                </button>
                <button class="lang-option" data-lang="bn">
                    🇮🇳 বাংলা (Bengali)
                </button>
    </div>
            <button id="enterVRBtn" class="enter-vr-btn" disabled style="opacity: 0.5;">🚀 Enter VR Experience</button>
            
            <h4>🎬 Guided Tour</h4>
            <button id="startTourBtn" class="tour-btn">Start Guided Tour</button>
            <p class="info-text">Experience a cinematic journey through the Solar System</p>
    </div>
    </div>

    <div class="control-panel">
        <h4>📍 Current Planet</h4>
        <p id="currentPlanet">None selected</p>
        
        <!-- Tour Controls (only shown during guided tour) -->
        <div id="tourControls" style="display: none;">
            <h4>🎬 Tour Controls</h4>
            <button id="pauseBtn" class="test-btn">⏸️ Pause</button>
            <button id="resumeBtn" class="test-btn" style="display: none;" disabled>▶️ Resume</button>
        </div>
        
        <h4>🤖 AI Q&A</h4>
        <button id="askQuestionBtn" class="test-btn">Ask a Question</button>
    </div>


    <a-scene background="color: #000011" style="display: none;">
        <!-- Space background -->
        <a-sky color="#000011"></a-sky>
        
        <!-- Preload all planet models -->
        <a-assets timeout="10000">
            <!-- Sun texture -->
            <img id="sunTexture" src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KICA8ZGVmcz4KICAgIDxyYWRpYWxHcmFkaWVudCBpZD0ic3VuR3JhZGllbnQiIGN4PSI1MCUiIGN5PSI1MCUiIHI9IjUwJSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiNGRkQ3MDAiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSI3MCUiIHN0b3AtY29sb3I9IiNGRkE1MDAiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjRkY2NjAwIi8+CiAgICA8L3JhZGlhbEdyYWRpZW50PgogIDwvZGVmcz4KICA8Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjI1NiIgZmlsbD0idXJsKCNzdW5HcmFkaWVudCkiLz4KICA8Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRkZENzAwIiBzdHJva2Utd2lkdGg9IjE2IiBvcGFjaXR5PSIwLjMiLz4KICA8Y2lyY2xlIGN4PSIyNTYiIGN5PSIyNTYiIHI9IjIyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjRkZBNTAwIiBzdHJva2Utd2lkdGg9IjEyIiBvcGFjaXR5PSIwLjIiLz4KPC9zdmc+">
            <a-asset-item id="sun-model" src="assets/planets/Sun.glb"></a-asset-item>
            <a-asset-item id="mercury-model" src="assets/planets/Mercury.glb"></a-asset-item>
            <a-asset-item id="venus-model" src="assets/planets/Venus.glb"></a-asset-item>
            <a-asset-item id="earth-model" src="assets/planets/Earth.glb"></a-asset-item>
            <a-asset-item id="mars-model" src="assets/planets/Mars.glb"></a-asset-item>
            <a-asset-item id="jupiter-model" src="assets/planets/Jupiter.glb"></a-asset-item>
            <a-asset-item id="saturn-model" src="assets/planets/Saturn.glb"></a-asset-item>
            <a-asset-item id="uranus-model" src="assets/planets/Uranus.glb"></a-asset-item>
            <a-asset-item id="neptune-model" src="assets/planets/Neptune.glb"></a-asset-item>
        </a-assets>
        
        <!-- Direct GLB model loading -->
        <!-- Starry sky background + procedural starfield -->
        <a-sky src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.4.0/examples/assets/images/starry-sky.jpg" rotation="0 -30 0"></a-sky>
        <a-entity starfield="count: 1000; radius: 220; size: 0.5"></a-entity>
        
        <!-- Enhanced lighting -->
        <a-entity light="type: point; intensity: 1.6; distance: 120; decay: 2" position="0 0 -30"></a-entity>
        <a-entity light="type: ambient; color: #404040; intensity: 0.45"></a-entity>
        
        
        <!-- Sun - USING YOUR 3D MODEL -->
        <a-entity position="0 0 -30" class="planet" data-planet-id="sun" data-planet-name="Sun" data-planet-desc="" data-raycastable>
            <!-- Your 3D Sun Model - Proper scale -->
            <a-entity gltf-model="#sun-model" position="0 0 0" scale="0.6 0.6 0.6"></a-entity>
            <!-- Fallback sphere (hidden by default, shown only if 3D model fails) -->
            <a-sphere position="0 0 0" radius="7.5" color="#FFD700" 
                material="color: #FFD700; transparent: false" visible="false">
        </a-sphere>
            <!-- Light source for illumination -->
            <a-light type="point" color="#FFD700" intensity="2" distance="125" decay="2"></a-light>
            <a-animation attribute="rotation" to="0 360 0" dur="20000" repeat="indefinite"></a-animation>
        </a-entity>
        <a-text value="Sun" position="0 3.0 -30" align="center" color="#ffffff" scale="0.75 0.75 1">
            <a-animation attribute="position" to="0 3.75 -30" dur="2000" repeat="indefinite" direction="alternate"></a-animation>
        </a-text>
        
        <!-- Mercury -->
        <a-entity id="mercury-orbit" orbit-parent="speed: 1.6" position="0 0 -30">
          <a-entity gltf-model="#mercury-model" position="6 0.35 0" scale="0.0003 0.0003 0.0003" spin-body="speed: 40" class="planet" data-planet-id="mercury" data-raycastable data-planet-name="Mercury" data-planet-desc="Mercury is the smallest and innermost planet in the Solar System. It has no moons and is covered in craters.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.3" color="#8C7853"></a-sphere>
          </a-entity>
          <a-text value="Mercury" position="0 0.75 0" align="center" color="#ffffff" scale="0.5 0.5 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 6; thickness: 0.15; color: #bfbfbf; opacity: 0.5" position="0 0 -30"></a-entity>
        
        <!-- Venus -->
        <a-entity id="venus-orbit" orbit-parent="speed: 0.9" position="0 0 -30">
          <a-entity gltf-model="#venus-model" position="8 0 0" scale="0.00045 0.00045 0.00045" spin-body="speed: 6" class="planet" data-planet-id="venus" data-raycastable data-planet-name="Venus" data-planet-desc="Venus is the second planet from the Sun and is often called Earth's sister planet due to similar size and mass.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.45" color="#FFC649"></a-sphere>
          </a-entity>
          <a-text value="Venus" position="0 1.25 0" align="center" color="#ffffff" scale="0.5 0.5 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 8; thickness: 0.15; color: #e0d6c6; opacity: 0.5" position="0 0 -30"></a-entity>
        
        <!-- Earth -->
        <a-entity id="earth-orbit" orbit-parent="speed: 0.42" position="0 0 -30">
          <a-entity gltf-model="#earth-model" position="12 0.5 0" scale="0.00048 0.00048 0.00048" spin-body="speed: 18" class="planet" data-planet-id="earth" data-raycastable data-planet-name="Earth" data-planet-desc="Earth is our home planet and the only known planet with life. It has one natural satellite, the Moon.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.45" color="#6B93D6"></a-sphere>
          </a-entity>
          <a-text value="Earth" position="0 1.25 0" align="center" color="#ffffff" scale="0.5 0.5 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 12; thickness: 0.18; color: #5fb3ff; opacity: 0.55" position="0 0 -30"></a-entity>
        
        <!-- Mars -->
        <a-entity id="mars-orbit" orbit-parent="speed: 0.32" position="0 0 -30">
          <a-entity gltf-model="#mars-model" position="16 0.45 0" scale="0.00036 0.00036 0.00036" spin-body="speed: 14" class="planet" data-planet-id="mars" data-raycastable data-planet-name="Mars" data-planet-desc="Mars is the fourth planet from the Sun and is often called the Red Planet due to its reddish appearance.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.36" color="#CD5C5C"></a-sphere>
          </a-entity>
          <a-text value="Mars" position="0 1.0 0" align="center" color="#ffffff" scale="0.5 0.5 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 16; thickness: 0.2; color: #ff8c66; opacity: 0.55" position="0 0 -30"></a-entity>
        
        
        <!-- Jupiter -->
        <a-entity id="jupiter-orbit" orbit-parent="speed: 0.14" position="0 0 -30">
          <a-entity gltf-model="#jupiter-model" position="22 0 0" scale="0.0015 0.0015 0.0015" spin-body="speed: 8" class="planet" data-planet-id="jupiter" data-raycastable data-planet-name="Jupiter" data-planet-desc="Jupiter is the largest planet in our Solar System and is a gas giant with no solid surface.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.9" color="#D8CA9D"></a-sphere>
          </a-entity>
          <a-text value="Jupiter" position="0 2.25 0" align="center" color="#ffffff" scale="0.625 0.625 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 22; thickness: 0.2; color: #d4c090; opacity: 0.5" position="0 0 -30"></a-entity>
        
        <!-- Saturn -->
        <a-entity id="saturn-orbit" orbit-parent="speed: 0.10" position="0 0 -30">
          <a-entity gltf-model="#saturn-model" position="28 0 0" scale="0.00135 0.00135 0.00135" spin-body="speed: 10" class="planet" data-planet-id="saturn" data-raycastable data-planet-name="Saturn" data-planet-desc="Saturn is the sixth planet from the Sun and is famous for its spectacular ring system.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.75" color="#FAD5A5"></a-sphere>
          </a-entity>
          <a-text value="Saturn" position="0 2.0 0" align="center" color="#ffffff" scale="0.625 0.625 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 28; thickness: 0.2; color: #f0e6c0; opacity: 0.45" position="0 0 -30"></a-entity>
        
        
        <!-- Uranus -->
        <a-entity id="uranus-orbit" orbit-parent="speed: 0.07" position="0 0 -30">
          <a-entity gltf-model="#uranus-model" position="34 0 0" scale="0.00075 0.00075 0.00075" spin-body="speed: 9" class="planet" data-planet-id="uranus" data-raycastable data-planet-name="Uranus" data-planet-desc="Uranus is the seventh planet from the Sun and is an ice giant with a unique sideways rotation.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.54" color="#4FD0E7"></a-sphere>
          </a-entity>
          <a-text value="Uranus" position="0 1.5 0" align="center" color="#ffffff" scale="0.5 0.5 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 34; thickness: 0.2; color: #6fd9ed; opacity: 0.45" position="0 0 -30"></a-entity>
        
        <!-- Neptune -->
        <a-entity id="neptune-orbit" orbit-parent="speed: 0.05" position="0 0 -30">
          <a-entity gltf-model="#neptune-model" position="40 0 0" scale="0.00072 0.00072 0.00072" spin-body="speed: 11" class="planet" data-planet-id="neptune" data-raycastable data-planet-name="Neptune" data-planet-desc="Neptune is the eighth and farthest planet from the Sun. It's an ice giant with the strongest winds in the Solar System.">
            <!-- Fallback sphere in case GLTF fails -->
            <a-sphere position="0 0 0" radius="0.45" color="#4B70DD"></a-sphere>
          </a-entity>
          <a-text value="Neptune" position="0 1.5 0" align="center" color="#ffffff" scale="0.5 0.5 1"></a-text>
        </a-entity>
        <a-entity orbit-ring="radius: 40; thickness: 0.2; color: #6b8fe6; opacity: 0.45" position="0 0 -30"></a-entity>
        
        <!-- Pluto -->
        <a-sphere position="170 0 -30" radius="0.15" color="#C0C0C0" class="planet" data-planet-id="pluto" data-raycastable data-planet-name="Pluto" data-planet-desc="Pluto is a dwarf planet in the Kuiper Belt. Though no longer classified as a planet, it remains an important celestial body.">
            <a-animation attribute="rotation" to="0 360 0" dur="35000" repeat="indefinite"></a-animation>

        </a-sphere>
        <a-text value="Pluto" position="170 0.5 -30" align="center" color="#ffffff" scale="0.375 0.375 1"></a-text>
        
        <!-- VR Rig with Custom Movement Controls -->
        <a-entity id="rig" position="0 1.6 0">
            <!-- Camera (headset view) -->
            <a-camera id="camera" wasd-controls-enabled="false"></a-camera>

            <!-- Right-hand controller -->
            <a-entity id="rightController"
                      oculus-touch-controls="hand: right"
                      raycaster="objects: [data-raycastable]; far: 100; near: 0.1"
                      line="color: #00FF00; opacity: 1.0; visible: true">
            </a-entity>

            <!-- Left-hand controller (optional for later) -->
            <a-entity id="leftController" oculus-touch-controls="hand: left"></a-entity>
        </a-entity>
        
        <!-- Fallback VR Cursor for headset-only VR -->
        <a-entity 
            cursor="fuse: true; fuseTimeout: 1000" 
            position="0 0 -1" 
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03" 
            material="color: cyan; shader: flat">
        </a-entity>

        <!-- Debug pointer for VR controllers -->
        <a-entity id="debugPointer" 
                  position="0 0 -1" 
                  geometry="primitive: sphere; radius: 0.02"

        // Audio unlock function for browser autoplay policy
        function unlockAudio() {
            console.log('🔊 Unlocking audio for autoplay...');
            
            try {
                // Create a silent audio buffer and play it to unlock audio
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = audioContext.createBuffer(1, 1, 22050);
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
                
                // Resume audio context if suspended
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                // Also try to unlock with a simple audio element
                const audio = new Audio();
                audio.volume = 0.01;
                audio.play().catch(() => {
                    console.log('🔊 Audio element unlock failed, but AudioContext should work');
                });
                
                console.log('✅ Audio unlocked successfully');
            } catch (error) {
                console.warn('⚠️ Audio unlock failed:', error);
            }
        }

        async function speakPlanetInfo() {
            if (!currentPlanet) return;
            if (!vrStarted) {
                console.log('🔇 TTS blocked - VR not started yet');
                return;
            }
            
            // Get the selected language from localStorage
            const selectedLang = localStorage.getItem('selectedLanguage') || 'en';
            console.log(`🔊 TTS Request - Language: ${selectedLang}, Planet: ${currentPlanet.name}`);
            
            try {
                // First translate the text to the selected language
                const translationResponse = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: currentPlanet.description,
                        sourceLang: 'en',
                        targetLang: selectedLang
                    })
                });
                
                if (translationResponse.ok) {
                    const result = await translationResponse.json();
                    const translatedText = result.translatedText || result.text || currentPlanet.description;
                    
                    console.log(`🔄 Translated text for TTS: ${translatedText}`);
                    
                    // Always use Sarvam TTS via ttsManager with separated fetch/play
                    if (window.ttsManager && window.ttsManager.fetchServerTTSAudio) {
                        console.log(`🎯 Fetching Sarvam TTS for ${selectedLang}`);
                        const audioData = await window.ttsManager.fetchServerTTSAudio(translatedText, selectedLang);
                        console.log(`🎵 Playing TTS for: ${currentPlanet.name} in ${selectedLang} using Sarvam API`);
                        await window.ttsManager.playServerTTSAudio(audioData);
                    } else {
                        throw new Error('TTS Manager not available');

                    throw new Error('Translation service not available');
                }
            } catch (error) {
                console.error('TTS error:', error);
                console.log('❌ TTS failed - no fallback available');
            }
        }
        
        async function translatePlanetInfo() {
            if (!currentPlanet) return;
            
            console.log(`🔄 Translation Request - Target Language: ${currentLanguage}, Planet: ${currentPlanet.name}`);
            
            try {
                // Use the main server translation endpoint
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: currentPlanet.description,
                        sourceLang: 'en',
                        targetLang: currentLanguage
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success || result.translatedText) {
                        const translatedText = result.translatedText || result.text;
                        console.log('Translation successful:', translatedText);
                        showVRMessage(`Translated ${currentPlanet.name} to ${languages[languageIndex].name}`);
                        
                        // Update the planet description temporarily for TTS

                        currentPlanet.description = translatedText;
                        
                        // Speak the translation

                        // Restore original description

        // Smooth camera movement controls
        let camera = null;
        let cameraPosition = { x: 0, y: 1.6, z: 5 };
        let targetPosition = { x: 0, y: 1.6, z: 5 };
        let cameraRotation = { x: 0, y: 0, z: 0 };
        const moveSpeed = 0.2;
        const rotationSpeed = 3;
        const smoothingFactor = 0.08;
        let keysPressed = {};
        let animationRunning = false;

        function initializeCamera() {
            camera = document.querySelector('a-camera');
            if (camera) {
                console.log('Camera found, setting up smooth controls');
                startSmoothAnimation();
            }
        }

        function startSmoothAnimation() {
            if (!animationRunning) {
                animationRunning = true;
                smoothUpdate();
            }
        }

        function smoothUpdate() {
            if (camera && animationRunning) {
                // Smooth interpolation for position
                cameraPosition.x += (targetPosition.x - cameraPosition.x) * smoothingFactor;
                cameraPosition.y += (targetPosition.y - cameraPosition.y) * smoothingFactor;
                cameraPosition.z += (targetPosition.z - cameraPosition.z) * smoothingFactor;
                
                camera.setAttribute('position', `${cameraPosition.x} ${cameraPosition.y} ${cameraPosition.z}`);
                camera.setAttribute('rotation', `${cameraRotation.x} ${cameraRotation.y} ${cameraRotation.z}`);
                
                requestAnimationFrame(smoothUpdate);
            }
        }

        document.addEventListener('keydown', (event) => {
            if (!camera) return;

            switch(event.key) {
                case 'ArrowUp':
                    targetPosition.z -= moveSpeed;
                    break;
                case 'ArrowDown':
                    targetPosition.z += moveSpeed;
                    break;
                case 'ArrowLeft':
                    targetPosition.x -= moveSpeed;
                    break;
                case 'ArrowRight':
                    targetPosition.x += moveSpeed;
                    break;
                case 'PageUp':
                    targetPosition.y += moveSpeed;
                    break;
                case 'PageDown':
                    targetPosition.y -= moveSpeed;
                    break;
                case 'w':
                case 'W':
                    cameraRotation.x -= rotationSpeed;
                    break;
                case 's':
                case 'S':
                    cameraRotation.x += rotationSpeed;
                    break;
                case 'a':
                case 'A':
                    cameraRotation.y += rotationSpeed;
                    break;
                case 'd':
                case 'D':
                    cameraRotation.y -= rotationSpeed;
                    break;
            }
            
            event.preventDefault();
        });

        // Movement + Selection in VR
        function setupVRControllerMovement() {
            const rig = document.querySelector("#rig");
            const camera = document.querySelector("#camera");
            const rightController = document.querySelector("#rightController");

            if (!rig || !camera || !rightController) {
                console.error('❌ VR elements not found for controller setup');
                return;
            }

            console.log('🎮 Setting up VR controller movement and selection...');

            // Make custom pointer always visible and follow controller
            const customPointer = document.getElementById('customPointer');
            if (customPointer) {
                customPointer.setAttribute('visible', 'true');
                console.log('🎯 Custom pointer enabled and visible');
                
                // Update pointer position every frame to follow controller
                function updatePointer() {
                    if (customPointer && rightController) {
                        const controllerPos = rightController.getAttribute('position');
                        const controllerRot = rightController.getAttribute('rotation');
                        
                        // Position pointer slightly in front of controller for visibility
                        const forwardOffset = new THREE.Vector3(0, 0, -0.2);
                        forwardOffset.applyEuler(new THREE.Euler(0, THREE.MathUtils.degToRad(controllerRot.y), 0));
                        
                        const pointerPos = {
                            x: controllerPos.x + forwardOffset.x,
                            y: controllerPos.y + forwardOffset.y,
                            z: controllerPos.z + forwardOffset.z
                        };
                        
                        customPointer.setAttribute('position', pointerPos);
                        customPointer.setAttribute('rotation', controllerRot);
                    }
                    requestAnimationFrame(updatePointer);
                }
                updatePointer();
            } else {
                console.error('❌ Custom pointer not found!');
            }

            // ---- Movement with Thumbstick ----
            rightController.addEventListener("thumbstickmoved", (e) => {
                const moveSpeed = 0.05; // adjust speed
                const direction = new THREE.Vector3();

                // Forward direction (where headset is looking)
                camera.object3D.getWorldDirection(direction);

                // Move forward/back
                rig.object3D.position.addScaledVector(direction, -e.detail.y * moveSpeed);
            });

            // ---- Planet Selection with Trigger ----
            rightController.addEventListener("triggerdown", () => {
                console.log('🎯 Trigger pressed - checking for planet selection');
                unlockAudio(); // Unlock audio on VR controller interaction
                
                // Show visual feedback
                const triggerFeedback = document.getElementById('triggerFeedback');

                    const planetEl = intersection.object.el;

                            planetPosition.x - controllerPosition.x,
                            planetPosition.y - controllerPosition.y,
                            planetPosition.z - controllerPosition.z

                kn: "ಮಂಗಳ, ಕೆಂಪು ಗ್ರಹ. ಈ ಧೂಳಿನ ಜಗತ್ತು ಸೌರವ್ಯೂಹದ ಅತ್ಯಂತ ದೊಡ್ಡ ಜ್ವಾಲಾಮುಖಿ, ಒಲಿಂಪಸ್ ಮಾನ್ಸ್ ಅನ್ನು ಹೊಂದಿದೆ ಮತ್ತು ಪ್ರಾಚೀನ ನೀರಿನ ಹರಿವಿನ ಪುರಾವೆಗಳನ್ನು ತೋರಿಸುತ್ತದೆ. ವಿಜ್ಞಾನಿಗಳು ಮಂಗಳವು ಒಮ್ಮೆ ಜೀವನವನ್ನು ಬೆಂಬಲಿಸಿರಬಹುದು ಎಂದು ನಂಬುತ್ತಾರೆ.",
                ta: "செவ்வாய், சிவப்பு கோள். இந்த தூசி நிறைந்த உலகம் சூரிய குடும்பத்தின் மிகப்பெரிய எரிமலை, ஒலிம்பஸ் மான்ஸ் மற்றும் பண்டைய நீர் ஓட்டத்தின் சான்றுகளைக் காட்டுகிறது. செவ்வாய் ஒரு காலத்தில் வாழ்க்கையை ஆதரித்திருக்கலாம் என்று விஞ்ஞானிகள் நம்புகிறார்கள்.",
                te: "మార్స్, ఎరుపు గ్రహం. ఈ దుమ్ము నిండిన ప్రపంచం సౌర వ్యవస్థలో అతిపెద్ద అగ్నిపర్వతం, ఒలింపస్ మాన్స్ ని కలిగి ఉంది మరియు ప్రాచీన నీటి ప్రవాహాల సాక్ష్యాలను చూపిస్తుంది. మార్స్ ఒకప్పుడు జీవితానికి మద్దతు ఇచ్చి ఉండవచ్చు అని శాస్త్రవేత్తలు నమ్ముతున్నారు.",
                bn: "মঙ্গল, লাল গ্রহ। এই ধূলিময় জগতে সৌরজগতের বৃহত্তম আগ্নেয়গিরি, অলিম্পাস মনস রয়েছে এবং প্রাচীন জল প্রবাহের প্রমাণ দেখায়। বিজ্ঞানীরা বিশ্বাস করেন যে মঙ্গল একসময় জীবনকে সমর্থন করেছিল।"
            },
            jupiter: {
                en: "Jupiter, the largest planet in our Solar System. This gas giant has a Great Red Spot, a storm that has raged for over 400 years. Jupiter's powerful gravity protects the inner planets from dangerous asteroids.",
                hi: "बृहस्पति, हमारे सौर मंडल का सबसे बड़ा ग्रह। इस गैसीय विशालकाय में एक महान लाल धब्बा है, एक तूफान जो 400 से अधिक वर्षों से चल रहा है। बृहस्पति का शक्तिशाली गुरुत्वाकर्षण आंतरिक ग्रहों को खतरनाक क्षुद्रग्रहों से बचाता है।",
                kn: "ಗುರು, ನಮ್ಮ ಸೌರವ್ಯೂಹದ ಅತ್ಯಂತ ದೊಡ್ಡ ಗ್ರಹ. ಈ ಅನಿಲ ದೈತ್ಯನು 400 ವರ್ಷಗಳಿಗಿಂತ ಹೆಚ್ಚು ಕಾಲ ಸಂಭವಿಸಿದ ಮಹಾನ್ ಕೆಂಪು ಚುಕ್ಕೆಯನ್ನು ಹೊಂದಿದೆ. ಗುರುವಿನ ಶಕ್ತಿಶಾಲಿ ಗುರುತ್ವಾಕರ್ಷಣೆಯು ಒಳಗಿನ ಗ್ರಹಗಳನ್ನು ಅಪಾಯಕಾರಿ ಕ್ಷುದ್ರಗ್ರಹಗಳಿಂದ ರಕ್ಷಿಸುತ್ತದೆ.",
                ta: "வியாழன், நமது சூரிய குடும்பத்தின் மிகப்பெரிய கோள். இந்த வாயு மாபெரும் கோளில் ஒரு பெரிய சிவப்பு புள்ளி உள்ளது, 400 ஆண்டுகளுக்கும் மேலாக வீசும் புயல். வியாழனின் சக்திவாய்ந்த ஈர்ப்பு விசை உள் கோள்களை ஆபத்தான சிறுகோள்களிலிருந்து பாதுகாக்கிறது.",
                te: "గురుడు, మన సౌర వ్యవస్థలో అతిపెద్ద గ్రహం. ఈ వాయు మహాగ్రహానికి గొప్ప ఎరుపు మచ్చ ఉంది, ఇది 400 సంవత్సరాలకు పైగా ఉగ్రంగా ఉంది. గురుడు యొక్క శక్తివంతమైన గురుత్వాకర్షణ ఒత్తిడి లోపలి గ్రహాలను ప్రమాదకరమైన గ్రహశకలాల నుండి రక్షిస్తుంది.",
                bn: "বৃহস্পতি, আমাদের সৌরজগতের বৃহত্তম গ্রহ। এই গ্যাসীয় দৈত্যের একটি মহান লাল দাগ রয়েছে, একটি ঝড় যা 400 বছরেরও বেশি সময় ধরে চলছে। বৃহস্পতির শক্তিশালী মাধ্যাকর্ষণ অভ্যন্তরীণ গ্রহগুলিকে বিপজ্জনক গ্রহাণু থেকে রক্ষা করে।"
            },
            saturn: {
                en: "Saturn, famous for its spectacular ring system. These beautiful rings are made of ice, rock, and dust, orbiting the planet in perfect harmony. Saturn's rings are one of the most stunning sights in our Solar System.",
                hi: "शनि, अपने शानदार वलय प्रणाली के लिए प्रसिद्ध। ये सुंदर वलय बर्फ, पत्थर और धूल से बने हैं, जो ग्रह के चारों ओर पूर्ण सामंजस्य में घूमते हैं। शनि के वलय हमारे सौर मंडल के सबसे आकर्षक दृश्यों में से एक हैं।",
                kn: "ಶನಿ, ಅದರ ಅದ್ಭುತ ಉಂಗುರ ವ್ಯವಸ್ಥೆಗೆ ಹೆಸರುವಾಸಿ. ಈ ಸುಂದರವಾದ ಉಂಗುರಗಳು ಮಂಜು, ಕಲ್ಲು ಮತ್ತು ಧೂಳಿನಿಂದ ಮಾಡಲ್ಪಟ್ಟಿವೆ, ಗ್ರಹದ ಸುತ್ತಲೂ ಪರಿಪೂರ್ಣ ಸಾಮರಸ್ಯದಲ್ಲಿ ಸುತ್ತುತ್ತಿವೆ. ಶನಿಯ ಉಂಗುರಗಳು ನಮ್ಮ ಸೌರವ್ಯೂಹದ ಅತ್ಯಂತ ಆಕರ್ಷಕ ದೃಶ್ಯಗಳಲ್ಲಿ ಒಂದಾಗಿವೆ.",
                ta: "சனி, அதன் கண்கொள்ளும் வளைய அமைப்புக்கு பிரபலமானது. இந்த அழகான வளையங்கள் பனி, பாறை மற்றும் தூசியால் ஆனவை, கோளைச் சுற்றி சரியான ஒத்திசைவில் சுழல்கின்றன. சனியின் வளையங்கள் நமது சூரிய குடும்பத்தின் மிகவும் கவர்ச்சிகரமான காட்சிகளில் ஒன்று.",
                te: "శని, దాని అద్భుతమైన ఉంగరాల వ్యవస్థకు ప్రసిద్ధి చెందింది. ఈ అందమైన ఉంగరాలు మంచు, రాతి మరియు దుమ్ముతో తయారు చేయబడ్డాయి, గ్రహం చుట్టూ పరిపూర్ణ సామరస్యంతో సుత్తున్నాయి. శని ఉంగరాలు మన సౌర వ్యవస్థలో అత్యంత ఆకర్షణీయమైన దృశ్యాలలో ఒకటి.",
                bn: "শনি, তার চমৎকার বলয় ব্যবস্থার জন্য বিখ্যাত। এই সুন্দর বলয়গুলি বরফ, পাথর এবং ধূলো দিয়ে তৈরি, যা গ্রহের চারপাশে নিখুঁত সাদৃশ্যের সাথে ঘুরছে। শনির বলয়গুলি আমাদের সৌরজগতের সবচেয়ে চমৎকার দৃশ্যগুলির মধ্যে একটি।"
            },
            uranus: {
                en: "Uranus, the ice giant with a unique sideways rotation. This planet rotates on its side, making it appear to roll through space like a giant blue marble. Uranus has faint rings and 27 known moons.",
                hi: "अरुण, एक अनूठे पार्श्व घूर्णन के साथ बर्फीला विशालकाय। यह ग्रह अपनी तरफ घूमता है, जिससे यह अंतरिक्ष में एक विशाल नीले संगमरमर की तरह लुढ़कता हुआ दिखाई देता है। अरुण के पास हल्के वलय और 27 ज्ञात चंद्रमा हैं।",
                kn: "ಅರಣ, ವಿಶಿಷ್ಟವಾದ ಪಾರ್ಶ್ವ ಭ್ರಮಣೆಯೊಂದಿಗೆ ಹಿಮ ದೈತ್ಯ. ಈ ಗ್ರಹವು ಅದರ ಬದಿಯಲ್ಲಿ ತಿರುಗುತ್ತದೆ, ಇದು ಬಾಹ್ಯಾಕಾಶದಲ್ಲಿ ಒಂದು ದೈತ್ಯ ನೀಲಿ ಗುಂಡುಗಳಂತೆ ಉರುಳುತ್ತಿರುವಂತೆ ಕಾಣಿಸುತ್ತದೆ. ಅರಣನಿಗೆ ಮಸುಕಾದ ಉಂಗುರಗಳು ಮತ್ತು 27 ತಿಳಿದಿರುವ ಚಂದ್ರರಿಗಳಿವೆ.",
                ta: "யுரேனஸ், தனித்துவமான பக்கவாட்டு சுழற்சியுடன் கூடிய பனி மாபெரும் கோள். இந்த கோள் அதன் பக்கவாட்டில் சுழல்கிறது, இது ஒரு பெரிய நீல பளிங்கு போல விண்வெளியில் உருளுவதைப் போல தோன்றுகிறது. யுரேனஸுக்கு மங்கலான வளையங்கள் மற்றும் 27 அறியப்பட்ட நிலாக்கள் உள்ளன.",
                te: "యురేనస్, ఒక ప్రత్యేకమైన పార్శ్వ భ్రమణంతో హిమ దైత్యుడు. ఈ గ్రహం దాని వైపు తిరుగుతుంది, ఇది ఒక పెద్ద నీలం గోళిక వలె అంతరిక్షంలో రోల్ అవుతున్నట్లు కనిపిస్తుంది. యురేనస్కు మసక మసకగా ఉంగరాలు మరియు 27 తెలిసిన చంద్రులు ఉన్నారు.",
                bn: "ইউরেনাস, একটি অনন্য পার্শ্বীয় ঘূর্ণন সহ বরফের দৈত্য। এই গ্রহটি তার পাশে ঘোরে, যা এটিকে একটি বিশাল নীল মার্বেলের মতো মহাকাশে গড়িয়ে যেতে দেখা যায়। ইউরেনাসের অস্পষ্ট বলয় এবং 27টি পরিচিত চাঁদ রয়েছে।"
            },
            neptune: {
                en: "Neptune, the farthest planet from the Sun. This deep blue ice giant has the strongest winds in the Solar System, reaching speeds of over 2,000 kilometers per hour. Neptune's mysterious dark spots are massive storms.",
                hi: "नेपच्यून, सूर्य से सबसे दूर का ग्रह। इस गहरे नीले बर्फीले विशालकाय में सौर मंडल की सबसे तेज हवाएं हैं, जो प्रति घंटे 2,000 किलोमीटर से अधिक की गति तक पहुंचती हैं। नेपच्यून के रहस्यमय काले धब्बे बड़े तूफान हैं।",
                kn: "ನೆಪ್ಚೂನ್, ಸೂರ್ಯನಿಂದ ಅತ್ಯಂತ ದೂರದ ಗ್ರಹ. ಈ ಆಳವಾದ ನೀಲಿ ಹಿಮ ದೈತ್ಯನು ಸೌರವ್ಯೂಹದ ಅತ್ಯಂತ ಬಲವಾದ ಗಾಳಿಗಳನ್ನು ಹೊಂದಿದೆ, ಇದು ಗಂಟೆಗೆ 2,000 ಕಿಲೋಮೀಟರ್‌ಗಿಂತ ಹೆಚ್ಚು ವೇಗವನ್ನು ತಲುಪುತ್ತದೆ. ನೆಪ್ಚೂನ್‌ನ ರಹಸ್ಯಮಯ ಕಪ್ಪು ಚುಕ್ಕೆಗಳು ಬೃಹತ್ ಚಂಡಮಾರುತಗಳಾಗಿವೆ.",
                ta: "நெப்டியூன், சூரியனிலிருந்து மிக தொலைவில் உள்ள கோள். இந்த ஆழமான நீல பனி மாபெரும் கோளில் சூரிய குடும்பத்தின் மிகவும் வலுவான காற்றுகள் உள்ளன, இது மணிக்கு 2,000 கிலோமீட்டர் வேகத்தை எட்டுகிறது. நெப்டியூனின் மர்மமான கருப்பு புள்ளிகள் பெரிய புயல்கள்.",
                te: "నెప్ట్యూన్, సూర్యుని నుండి అత్యంత దూరంలో ఉన్న గ్రహం. ఈ లోతైన నీలం హిమ దైత్యుడికి సౌర వ్యవస్థలో అత్యంత బలమైన గాలులు ఉన్నాయి, ఇవి గంటకు 2,000 కిలోమీటర్ల వేగాన్ని చేరుకుంటాయి. నెప్ట్యూన్ యొక్క మర్మమైన చీకటి మచ్చలు భారీ తుఫాన్లు.",
                bn: "নেপচুন, সূর্য থেকে সবচেয়ে দূরে গ্রহ। এই গভীর নীল বরফের দৈত্যের সৌরজগতের সবচেয়ে শক্তিশালী বাতাস রয়েছে, যা প্রতি ঘণ্টায় 2,000 কিলোমিটারেরও বেশি গতিতে পৌঁছায়। নেপচুনের রহস্যময় কালো দাগগুলি বিশাল ঝড়।"

                if (tourPaused) {
                    // Wait until tour is resumed
                    while (tourPaused) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                }
                await new Promise(resolve => setTimeout(resolve, 100));
            }

        // Move camera to specific position smoothly with cinematic effects
        async function moveToPosition(rig, position) {
            return new Promise(async (resolve) => {
                const currentPos = rig.getAttribute('position');
                const distance = Math.sqrt(
                    Math.pow(position.x - currentPos.x, 2) + 
                    Math.pow(position.y - currentPos.y, 2) + 
                    Math.pow(position.z - currentPos.z, 2)
                );
                
                // Adjust duration based on distance for more natural movement
                const duration = Math.max(2000, Math.min(5000, distance * 200));
                
                console.log(`🎬 Moving camera to ${position.x}, ${position.y}, ${position.z} over ${duration}ms`);
                
                rig.setAttribute('animation__move', {
                    property: 'position',
                    to: `${position.x} ${position.y} ${position.z}`,
                    dur: duration,
                    easing: 'easeInOutCubic'
                });
                
                // Use pause-aware wait instead of setTimeout
                await wait(duration);
                        resolve();
            });
        }

            const rig = document.querySelector('#rig');
            if (!rig) return;
            
            const planetPos = planetEl.getAttribute('position');
            const currentPos = rig.getAttribute('position');
            
            // Calculate position closer to the planet
            const distance = Math.sqrt(
                Math.pow(planetPos.x - currentPos.x, 2) + 
                Math.pow(planetPos.y - currentPos.y, 2) + 
                Math.pow(planetPos.z - currentPos.z, 2)
            );
            
            // Move closer but not too close (maintain good viewing distance)
            const targetDistance = Math.min(distance * 0.7, 15); // 70% closer, max 15 units
            const direction = {
                x: (planetPos.x - currentPos.x) / distance,
                y: (planetPos.y - currentPos.y) / distance,
                z: (planetPos.z - currentPos.z) / distance
            };
            
            const targetPos = {
                x: planetPos.x - direction.x * targetDistance,
                y: Math.max(1.6, planetPos.y - direction.y * targetDistance), // Keep camera above ground
                z: planetPos.z - direction.z * targetDistance
            };
            
            console.log(`🎯 Focusing on ${planetId} - moving camera closer`);
            await moveToPosition(rig, targetPos);
        }

        // Enhanced text-to-speech using only Sarvam TTS with timeout
        async function speakText(text, language) {
            console.log(`🗣️ Speaking in ${language}: ${text.substring(0, 50)}...`);
            
            // Wait for pause to be cleared before speaking
            while (tourPaused && isTourActive) {
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            
            try {
                // Always use Sarvam TTS via ttsManager with timeout
                if (window.ttsManager && window.ttsManager.fetchServerTTS) {
                    console.log(`🎯 Using Sarvam TTS for ${language}`);
                    
                    // Create a timeout promise (max 20 seconds)
                    const timeoutPromise = new Promise((_, reject) => {
                        setTimeout(() => {
                            reject(new Error('TTS timeout - narration took too long'));
                        }, 20000); // 20 second timeout
                    });
                    
                    // Race between TTS completion and timeout
                    await Promise.race([
                        window.ttsManager.fetchServerTTS(text, language),
                        timeoutPromise
                    ]);
                    
                    console.log(`✅ Sarvam TTS completed for ${language}`);
                    return;
                } else {
                    throw new Error('TTS Manager not available');
                }
                
            } catch (error) {
                console.error('❌ Sarvam TTS error:', error);
                if (error.message.includes('timeout')) {
                    console.log('⏰ TTS timeout - continuing to next step');
                } else {
                    console.log('❌ TTS failed - no fallback available');
                }
                throw error;
            }
        }

        // Utility function to wait (with pause support during tours)
        function wait(ms) {
            if (isTourActive) {
                return waitWithPauseCheck(ms);
            } else {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }

        // Highlight a planet during tour with cinematic effects
        function highlightPlanet(planetEl) {
            console.log(`✨ Highlighting planet: ${planetEl.getAttribute('data-planet-name')}`);
            
            // Store original scale for restoration
            const gltfModel = planetEl.querySelector('[gltf-model]');
            if (gltfModel) {
                const currentScale = gltfModel.getAttribute('scale');
                // Convert Vector3 to string for storage
                const scaleString = `${currentScale.x} ${currentScale.y} ${currentScale.z}`;
                planetEl.setAttribute('data-original-scale', scaleString);
                
                // Scale up with smooth animation
                const newScale = `${currentScale.x * 1.3} ${currentScale.y * 1.3} ${currentScale.z * 1.3}`;
                
                gltfModel.setAttribute('animation__highlight', {
                    property: 'scale',
                    to: newScale,
                    dur: 1500,
                    easing: 'easeOutElastic'
                });
                
                // Add pulsing glow effect
                const pulseScale = `${currentScale.x * 1.4} ${currentScale.y * 1.4} ${currentScale.z * 1.4}`;
                gltfModel.setAttribute('animation__pulse', {
                    property: 'scale',
                    to: pulseScale,
                    dur: 2000,
                    dir: 'alternate',
                    loop: 'indefinite',
                    easing: 'easeInOutSine'
                });
                
                // Add rotation animation for more dynamic effect
                gltfModel.setAttribute('animation__rotate', {
                    property: 'rotation',
                    to: '0 360 0',
                    dur: 8000,
                    loop: 'indefinite',
                    easing: 'linear'
                });
            }
            
            // Add ambient light around the planet for dramatic effect
            const planetPos = planetEl.getAttribute('position');
            const highlightLight = document.createElement('a-light');
            highlightLight.setAttribute('type', 'point');
            highlightLight.setAttribute('color', '#FFD700');
            highlightLight.setAttribute('intensity', '2');
            highlightLight.setAttribute('distance', '10');
            highlightLight.setAttribute('position', planetPos);
            highlightLight.setAttribute('id', 'planetHighlightLight');
            
            planetEl.appendChild(highlightLight);
        }

        // Remove planet highlight and clean up effects
        function removePlanetHighlight(planetEl) {
            console.log(`✨ Removing highlight from planet: ${planetEl.getAttribute('data-planet-name')}`);
            
            const gltfModel = planetEl.querySelector('[gltf-model]');
            if (gltfModel) {
                // Remove all animations
                gltfModel.removeAttribute('animation__highlight');
                gltfModel.removeAttribute('animation__pulse');
                gltfModel.removeAttribute('animation__rotate');
                
                // Restore original scale with smooth animation
                const originalScale = planetEl.getAttribute('data-original-scale') || '0.0001 0.0001 0.0001';
                gltfModel.setAttribute('animation__restore', {
                    property: 'scale',
                    to: originalScale,
                    dur: 1000,
                    easing: 'easeInOutCubic'
                });
                
                // Clean up after animation
                setTimeout(() => {
                    gltfModel.removeAttribute('animation__restore');
                }, 1000);
            }
            
            // Remove highlight light
            const highlightLight = planetEl.querySelector('#planetHighlightLight');
            if (highlightLight) {
                highlightLight.remove();
            }
        }

        // AI Q&A Functions
        let speechRecognition = null;
        
        function startVoiceQuestion() {
            console.log('🎤 Starting voice question...');
            
            // Check if speech recognition is supported
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition is not supported in this browser. Please use Chrome or Edge.');
                return;
            }
            
            // Initialize speech recognition
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            speechRecognition = new SpeechRecognition();
            
            // Configure recognition
            const selectedLang = localStorage.getItem('selectedLanguage') || 'en';
            speechRecognition.lang = getSpeechRecognitionLang(selectedLang);
            speechRecognition.continuous = false;
            speechRecognition.interimResults = false;
            
            console.log(`🎤 Speech recognition language set to: ${speechRecognition.lang}`);
            
            // Set up event handlers
            setupSpeechRecognition();
            
            // Start recognition
            speechRecognition.start();
            console.log('🎤 Listening for question...');
            
            // Show listening indicator
            showVRDebugDialog('🎤 Listening for your question...', '#00ff88', 5000);
        }
        
        function getSpeechRecognitionLang(lang) {
            const langMap = {
                'en': 'en-US',
                'hi': 'hi-IN',
                'kn': 'kn-IN',
                'ta': 'ta-IN',
                'te': 'te-IN',
                'mr': 'mr-IN',
                'bn': 'bn-IN'
            };
            return langMap[lang] || 'en-US';
        }
        
        // Set up speech recognition event handlers
        function setupSpeechRecognition() {
            if (!speechRecognition) return;
            
            speechRecognition.onresult = async (event) => {
                const question = event.results[0][0].transcript;
                console.log('🎤 User asked:', question);
                
                showVRDebugDialog(`🎤 Question: ${question}`, '#00ff88', 3000);
                
                try {
                    const answer = await getAIAnswer(question);
                    console.log('🤖 AI Answer:', answer);
                    
                    // Show answer in VR
                    showVRDebugDialog(`🤖 ${answer}`, '#ffffff', 10000);
                    
                    // Speak the answer using TTS
                    await speakAIAnswer(answer);
                    
                } catch (error) {
                    console.error('❌ AI Q&A failed:', error);
                    const errorMsg = 'Sorry, I couldn\'t get an answer right now.';
                    showVRDebugDialog(`❌ ${errorMsg}`, '#ff6b6b', 5000);
                    await speakAIAnswer(errorMsg);
                }
            };
            
            speechRecognition.onerror = (event) => {
                console.error('❌ Speech recognition error:', event.error);
                showVRDebugDialog(`❌ Speech error: ${event.error}`, '#ff6b6b', 5000);
            };
            
            speechRecognition.onend = () => {
                console.log('🎤 Speech recognition ended');
            };
        }
        
        // Translation helper function
        async function translateText(text, fromLang, toLang) {
            try {
                const res = await fetch('https://localhost:8040/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text, 
                        sourceLang: fromLang, 
                        targetLang: toLang 
                    })
                });
                const data = await res.json();
                return data.translatedText || text;
            } catch (err) {
                console.warn('Translation fallback:', err);
                return text; // fallback to original
            }
        }

        // Clean answer function to remove intro/outro fluff
        function cleanAnswer(text) {
            return text
                .replace(/^Sure.*?:\s*/i, "")   // remove "Sure, here's..."
                .replace(/Hope this helps.*$/i, "") // remove "Hope this helps"
                .replace(/Here is.*?:\s*/i, "")
                .replace(/^Of course.*?:\s*/i, "")
                .replace(/^Certainly.*?:\s*/i, "")
                .replace(/^Great question.*?:\s*/i, "")
                .replace(/^I'd be happy.*?:\s*/i, "")
                .replace(/^Let me.*?:\s*/i, "")
                .replace(/^Absolutely.*?:\s*/i, "")
                .replace(/^Yes.*?:\s*/i, "")
                .replace(/^No problem.*?:\s*/i, "")
                .replace(/^Here's.*?:\s*/i, "")
                .replace(/^That's.*?:\s*/i, "")
                .replace(/^Well.*?:\s*/i, "")
                .replace(/^So.*?:\s*/i, "")
                .replace(/^Now.*?:\s*/i, "")
                .replace(/^First.*?:\s*/i, "")
                .replace(/^To answer.*?:\s*/i, "")
                .replace(/^In response.*?:\s*/i, "")
                .replace(/^Regarding.*?:\s*/i, "")
                .replace(/^About.*?:\s*/i, "")
                .replace(/^Concerning.*?:\s*/i, "")
                .replace(/^As for.*?:\s*/i, "")
                .replace(/^When it comes to.*?:\s*/i, "")
                .replace(/^Speaking of.*?:\s*/i, "")
                .replace(/^In terms of.*?:\s*/i, "")
                .replace(/^With regard to.*?:\s*/i, "")
                .replace(/^In relation to.*?:\s*/i, "")
                .replace(/^In connection with.*?:\s*/i, "")
                .replace(/^In the context of.*?:\s*/i, "")
                .replace(/^In the case of.*?:\s*/i, "")
                .replace(/^In the matter of.*?:\s*/i, "")
                .replace(/^In the subject of.*?:\s*/i, "")
                .replace(/^In the topic of.*?:\s*/i, "")
                .replace(/^In the field of.*?:\s*/i, "")
                .replace(/^In the area of.*?:\s*/i, "")
                .replace(/^In the realm of.*?:\s*/i, "")
                .replace(/^In the world of.*?:\s*/i, "")
                .replace(/^In the universe of.*?:\s*/i, "")
                .replace(/^In the cosmos of.*?:\s*/i, "")
                .replace(/^In the space of.*?:\s*/i, "")
                .replace(/^In the galaxy of.*?:\s*/i, "")
                .replace(/^In the solar system of.*?:\s*/i, "")
                .replace(/^In the planetary system of.*?:\s*/i, "")
                .replace(/^In the celestial system of.*?:\s*/i, "")
                .replace(/^In the astronomical system of.*?:\s*/i, "")
                .replace(/^In the cosmic system of.*?:\s*/i, "")
                .replace(/^In the stellar system of.*?:\s*/i, "")
                .trim();
        }

        async function getAIAnswer(question, lang) {
            try {
                const currentLanguage = lang || localStorage.getItem('selectedLanguage') || 'en';
                console.log(`🤖 AI Q&A pipeline: "${question}" in ${currentLanguage}`);

                // 1. Translate question to English (if not already English)
                let translatedQ = question;
                if (currentLanguage !== 'en') {
                    console.log(`🌐 Translating question to English...`);
                    translatedQ = await translateText(question, currentLanguage, 'en');
                    console.log(`🌐 Translated: "${question}" → "${translatedQ}"`);
                }

                // 2. Send to Gemini
                console.log(`🤖 Sending to Gemini: "${translatedQ}"`);
                const geminiRes = await fetch('https://localhost:8040/api/ai/gemini-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: translatedQ })
                });
                
                if (!geminiRes.ok) {
                    throw new Error(`Gemini API error: ${geminiRes.status}`);
                }
                
                const geminiData = await geminiRes.json();
                let answerEn = geminiData.answer || "Sorry, I don't have an answer.";
                console.log(`🤖 Gemini response: "${answerEn}"`);

                // 3. Clean the answer
                answerEn = cleanAnswer(answerEn);
                console.log(`🧹 Cleaned answer: "${answerEn}"`);

                // 4. Translate answer back to user's language (if not English)
                let finalAnswer = answerEn;
                if (currentLanguage !== 'en') {
                    console.log(`🌐 Translating answer to ${currentLanguage}...`);
                    finalAnswer = await translateText(answerEn, 'en', currentLanguage);
                    console.log(`🌐 Final answer: "${finalAnswer}"`);
                }

                return finalAnswer;

            } catch (err) {
                console.error('❌ AI Q&A failed:', err);
                return 'Sorry, I couldn\'t get an answer right now.';
            }
        }
        
        async function speakAIAnswer(answer) {
            const selectedLang = localStorage.getItem('selectedLanguage') || 'en';
            console.log(`🗣️ Speaking AI answer in ${selectedLang}: ${answer.substring(0, 50)}...`);
            
            try {
                // Split long answers into chunks to prevent TTS timeout
                const MAX_TTS_CHARS = 400;
                let chunks = [];
                for (let i = 0; i < answer.length; i += MAX_TTS_CHARS) {
                    chunks.push(answer.slice(i, i + MAX_TTS_CHARS));
                }
                
                if (window.ttsManager && window.ttsManager.fetchServerTTS) {
                    // Speak each chunk separately
                    for (const chunk of chunks) {
                        await window.ttsManager.fetchServerTTS(chunk, selectedLang);
                        // Small delay between chunks for better listening experience
                        if (chunks.length > 1) {
                            await new Promise(resolve => setTimeout(resolve, 500));
                        }
                    }
                    console.log('✅ AI answer spoken successfully in chunks');
                } else {
                    throw new Error('TTS Manager not available');
                }
            } catch (error) {
                console.error('❌ Failed to speak AI answer:', error);
                // Fallback to browser TTS
                const utterance = new SpeechSynthesisUtterance(answer);
                utterance.lang = selectedLang;
                speechSynthesis.speak(utterance);
            }
        }

        // Initialize custom VR controls when scene loads
        document.addEventListener('DOMContentLoaded', () => {
            // Test tour system
            console.log('🎬 Tour system test:');
            console.log('🎬 Tour data available:', tourData ? 'Yes' : 'No');
            console.log('🎬 Available languages:', tourData ? Object.keys(tourData.overview) : 'None');
            console.log('🎬 Selected language:', localStorage.getItem('selectedLanguage') || 'en');
            
            // Test TTS system
            console.log('🗣️ TTS system test:');
            console.log('🗣️ TTS Manager available:', window.ttsManager ? 'Yes' : 'No');
            if (window.ttsManager) {
                console.log('🗣️ TTS Manager methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(window.ttsManager)));
                console.log('🗣️ TTS Manager speak method:', typeof window.ttsManager.speak);
            }
            console.log('🗣️ Speech Synthesis available:', window.speechSynthesis ? 'Yes' : 'No');
            
            // Test Speech Recognition system
            console.log('🎤 Speech Recognition test:');
            console.log('🎤 Speech Recognition available:', ('webkitSpeechRecognition' in window) || ('SpeechRecognition' in window) ? 'Yes' : 'No');
            
            // Speech recognition will be initialized when needed
            
            // Wait for scene to load, then setup custom controls
            const scene = document.querySelector('a-scene');
            if (scene) {
                scene.addEventListener('loaded', () => {
                    setTimeout(() => {
                        setupVRControllerMovement();

                });
            }
        });
    </script>

    <!-- Orbital Mechanics Components -->
    <script>
    /* ===== Orbit parent: rotate this parent to make the child revolve around the center =====
       Usage: attach to a parent that is positioned at the Sun (usually 0 0 0).
       Put your planet GLTF as a child and set the child's position to (radius, y, z).
       Example: <a-entity orbit-parent="speed: 0.5"></a-entity>
    */
    AFRAME.registerComponent('orbit-parent', {
      schema: {
        speed: { type: 'number', default: 0.4 } // radians per second
      },
      init() {
        this._lastTime = null;
      },
      tick(time, delta) {
        // delta is ms since last tick; convert to seconds
        if (!delta) return;
        const dt = delta / 1000;
        // rotate around Y axis in world-space by incrementing parent's rotation.y
        // We rotate the object3D directly to avoid setAttribute thrashing.
        this.el.object3D.rotation.y += this.data.speed * dt;
      }
    });

    /* ===== Spin (self-rotation) =====
       Attach directly to the planet entity (the GLTF child).
       Example: <a-entity spin-body="speed: 18; axis: y"></a-entity>
    */
    AFRAME.registerComponent('spin-body', {
      schema: {
        speed: { type: 'number', default: 20 }, // degrees/sec
        axis: { type: 'string', default: 'y' }, // 'x'|'y'|'z'
        enabled: { type: 'boolean', default: true }
      },
      init() {
        this._lastTime = null;
      },
      tick(time, delta) {
        if (!this.data.enabled || !delta) return;
        const dt = delta / 1000;
        const degToRad = Math.PI / 180;
        const rot = this.el.object3D.rotation;
        const deltaRad = this.data.speed * degToRad * dt;
        if (this.data.axis === 'x') rot.x += deltaRad;
        else if (this.data.axis === 'z') rot.z += deltaRad;
        else rot.y += deltaRad;
      }
    });

    /* ===== Starfield (lightweight procedurally generated star points) =====
       Usage: place <a-entity starfield="count:1200; radius:200;"></a-entity> once behind everything.
    */
    AFRAME.registerComponent('starfield', {
      schema: {
        count: { type: 'int', default: 1200 },
        radius: { type: 'number', default: 200 },
        size: { type: 'number', default: 0.6 }
      },
      init() {
        const THREE = AFRAME.THREE;
        const data = this.data;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(data.count * 3);

        for (let i = 0; i < data.count; i++) {
          const u = Math.random();
          const v = Math.random();
          const theta = 2 * Math.PI * u;
          const phi = Math.acos(2 * v - 1);
          const r = data.radius * (0.85 + Math.random() * 0.3);
          const x = r * Math.sin(phi) * Math.cos(theta);
          const y = r * Math.sin(phi) * Math.sin(theta);
          const z = r * Math.cos(phi);
          positions[3 * i] = x;
          positions[3 * i + 1] = y;
          positions[3 * i + 2] = z;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
          size: data.size,
          sizeAttenuation: true,
          transparent: true,
          opacity: 0.9
        });
        const points = new THREE.Points(geometry, material);
        this.el.setObject3D('starfield', points);
        this._rotSpeed = 0.0002;
      },
      tick(time, delta) {
        const obj = this.el.getObject3D('starfield');
        if (obj) obj.rotation.y += this._rotSpeed * (delta || 16);
      },
      remove() { this.el.removeObject3D('starfield'); }
    });

    /* ===== Orbit ring helper (A-Frame mesh) =====
       Usage: <a-entity orbit-ring="radius: 12; thickness:0.08; color:#7fbfff; opacity:0.55"></a-entity>
    */
    AFRAME.registerComponent('orbit-ring', {
      schema: {
        radius: { type: 'number', default: 10 },
        thickness: { type: 'number', default: 0.05 },
        color: { type: 'color', default: '#888' },
        opacity: { type: 'number', default: 0.5 }
      },
      init() {
        const THREE = AFRAME.THREE;
        const r = this.data.radius;
        const inner = Math.max(0.001, r - this.data.thickness / 2);
        const outer = r + this.data.thickness / 2;
        const segments = 128;
        const geom = new THREE.RingGeometry(inner, outer, segments);
        const mat = new THREE.MeshBasicMaterial({
          color: new THREE.Color(this.data.color),
          transparent: true,
          opacity: this.data.opacity,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.rotation.x = -Math.PI / 2; // lie flat on XZ plane
        this.el.setObject3D('ring', mesh);
      },
      remove() { this.el.removeObject3D('ring'); }
    });
    </script>
